<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Projeto 2.1/CSS/Style.css">
    <title>Document</title>
</head>
 
<body>
    <header class="topo">
        <div>
            <p class="tag">PROJETO DA AULA</p>
            <h1>Mural Interativo</h1>
            <p>Crie ideias, destaque favoritas e organize seu mural.</p>
        </div>
        <button id="btnTema" type="button"> Tema escuro</button>
    </header>
 
    <main class="container">
        <section class="painel">
            <label for="campoIdeia">Nova ideia</label>
            <div class="linha-form">
                <input id="campoIdeia" maxlength="80" placeholder="Ex.: criar uma página de portfólio">
                <button id="btnAdicionar" type="button">Adicionar card</button>
            </div>
            <p id="mensagem" aria-live="polite"></p>
        </section>
 
        <p> <strong id="contador">0</strong></p>
 
        <section id="mural" class="mural"></section>
        <script src="/Projeto 2.1/js/Script1.js"></script>
</body>
 
</html>
